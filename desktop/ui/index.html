<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'">
<title>AppSEND</title><link rel="stylesheet" href="style.css"></head><body>
    <svg class="symbols" aria-hidden="true">
      <defs>
        <symbol id="logo" viewBox="0 0 32 32">
          <path d="M6 12V5h20v7" />
          <path class="accent-stroke" d="M6 20v7h20v-7M12 16h8" />
        </symbol>
        <symbol id="file" viewBox="0 0 24 24">
          <path d="M14 3H6v18h12V7l-4-4v5h4M9 12h6m-6 4h4" />
        </symbol>
        <symbol id="device" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="13" rx="2" />
          <path d="M8 21h8m-4-4v4" />
        </symbol>
        <symbol id="phone" viewBox="0 0 24 24">
          <rect x="6" y="2" width="12" height="20" rx="3" />
          <path d="M10 5h4m-3 14h2" />
        </symbol>
        <symbol id="check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
        <symbol id="close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M6 18 18 6" />
        </symbol>
      </defs>
    </svg>

<section id="onboarding" hidden><svg class="onboarding-logo"><use href="#logo"/></svg><h1>AppSEND</h1><p>Выберите язык / Choose language</p><div class="language-options"><button id="first-ru">Русский</button><button id="first-en">English</button></div></section>
<div id="application" hidden>
 <aside><div class="brand"><svg><use href="#logo"/></svg><b>AppSEND</b></div>
 <nav aria-label="AppSEND"><button class="active" data-view="send"><span>↗</span><b data-text="navSend"></b></button><button data-view="receive"><span>↙</span><b data-text="navReceive"></b></button><button data-view="history"><span>◷</span><b data-text="history"></b></button></nav>
 <div class="sidebar-bottom"><div class="online"><i></i><span data-text="sameNetwork"></span></div><button id="language-button" class="text-button" aria-label="Language">EN</button></div></aside>
 <main><header><p id="view-eyebrow" data-text="sameNetwork"></p><span id="identity"></span></header>
 <section id="send-view" class="view">
 <div class="title-row"><h1 data-text="transfer"></h1><span class="step">↗</span></div>
 <p class="subtitle" data-text="transferHint"></p>
 <section class="file-area" id="drop"><div class="paper"><svg><use href="#file"/></svg><span>+</span></div><div class="file-copy"><h2 id="staged"></h2><p id="details"></p></div><button id="clear" class="icon-button" hidden><svg><use href="#close"/></svg></button></section>
 <div class="file-actions"><button id="choose" class="white-button" data-text="choose"></button><button id="clipboard" class="plain-button" data-text="paste"></button></div>
 <section class="devices"><div class="section-heading"><h2 data-text="devices"></h2><span id="device-count"></span></div><div id="peers"></div><p id="empty" data-text="empty"></p></section>
 <section class="edge-option"><div class="edge-row"><div class="edge-label"><span>⌁</span><label for="arm" data-text="edge"></label></div><label class="switch"><input id="arm" type="checkbox"><span></span></label></div><div id="edge-help" hidden><p data-text="edgeHelp"></p><select id="side"><option value="top" data-text="top"></option><option value="left" data-text="left"></option><option value="right" data-text="right"></option></select></div></section>
 <div class="send-row"><button id="send" class="send-button" disabled><span data-text="send"></span><span>↗</span></button><button id="cancel" class="text-button" hidden data-text="cancel"></button></div>
 </section>
 <section id="receive-view" class="view" hidden><div class="title-row"><h1 data-text="receiveTitle"></h1><span class="step">↙</span></div><p id="receive-help" class="subtitle" data-text="receiveHint"></p><div class="receive-visual"><div class="receiver-icon"><svg><use href="#device"/></svg></div><h2 id="receive-name"></h2><p class="online"><i></i><span data-text="online"></span></p></div></section>
 <section id="history-view" class="view" hidden><div class="title-row"><h1 data-text="history"></h1><span class="step">◷</span></div><div id="inline-history"></div></section>
 <div class="status-row"><span class="status-dot"></span><p id="status" role="status" aria-live="polite"></p></div><progress id="progress" max="1" value="0" hidden></progress><div id="result"></div>
 <footer><button id="received" class="text-button" data-text="received"></button><span>AppSEND · LAN</span></footer>
 </main><div class="top-edge" id="edge-indicator"></div>
</div>
<dialog id="language-dialog"><h2>Русский / English</h2><div class="receive-setting"><label for="auto-receive" data-text="autoReceive"></label><input id="auto-receive" type="checkbox" checked></div><p data-text="autoReceiveHint"></p><div class="language-options"><button id="set-ru">Русский</button><button id="set-en">English</button></div></dialog>
<dialog id="consent"><div class="dialog-file"><svg><use href="#file"/></svg></div><h2 id="consent-title"></h2><p id="consent-info"></p><p data-text="compare"></p><div class="dialog-actions"><button id="decline" class="plain-button" data-text="decline"></button><button id="approve" class="accent-button" data-text="confirm"></button></div></dialog>
<dialog id="received-dialog"><div class="dialog-heading"><h2 data-text="received"></h2><button id="close-received" class="icon-button"><svg><use href="#close"/></svg></button></div><div id="history"></div></dialog>
<script src="strings.js"></script><script src="renderer.js"></script></body></html>
